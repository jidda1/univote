<body>

  <div class="resetbodycontainer">

  <div class="resetBody">

    <!-- ------------- HEADING TEXT ---------- -->

    <div class="resetHeader">
      <p class="resetuppertext">Reset password</p>
      <p class="resetundertext">
        <span>Update the password for your verified student account.</span>
      </p>
    </div>

    <!------------------ form ----------------->

    <form class="resetfields">
      <div class="resetlabelInput">
        <label class="resetlabel" for="">New password</label>
        <input class="resetinput" type="password" placeholder="••••••••">
      </div>
      <div class="resetlabelInput">
        <label class="resetlabel" for="">Confirm new password</label>
        <input class="resetinput" type="password" placeholder="••••••••">
      </div>
      <p class="resetleast">Password should be at least 8 characters</p>
      <a href=""> <button type="submit" class="resetabutton"> <a href="test.html">Update password</a></button></a>
    </form>
    </div>
    </div>
