<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="logincss.css">
  </head>
  <body>
    <form class="body" id="forminput">
      <div class="header">
        <p class="uppertext">Welcome Back</p>
        <p class="undertext">Sign in to your verified account</p>
      </div>
      <div class="middle">
        <div class="inm">
          <label for="uginput" class="text"
            >Enter you matriculation number</label
          >
          <div class="ip">
            <input
              type="text"
              class="up"
              id="uginput"
              placeholder="enter your matriculation number"
            />
            <small id="ugerror">Enter your Matriculation Number</small>
          </div>
        </div>
        <div class="downn">
          <div class="inm">
            <label for="passwordinput" class="text">Enter your Password</label>
            <div class="ip">
              <input
                class="down"
                type="password"
                id="passwordinput"
                placeholder="enter your password"
              />
              <small id="perror">Enter your Password</small>
            </div>
          </div>
          <div class="two">
            <span>
              <input type="checkbox" id="checkinput" />
              <label for="checkinput" class="a">Remember me</label>
            </span>
            <a href="forgot-password.html" class="link">Forgot password</a>
          </div>
        </div>
      </div>
      <button type="submit" class="button">Login</button>
    </form>

    <!----------------------- SCRIPT ----------------------->

    <script>
      const uginput = document.getElementById("uginput");
      const ugerror = document.getElementById("ugerror");
      const passwordinput = document.getElementById("passwordinput");
      const perror = document.getElementById("perror");
      const form = document.getElementById("forminput");
      const rme = document.getElementById("checkinput");
      const fp = document.getElementById("useless");

      function val() {
        let ugvalue = uginput.value.trim();
        let pvalue = passwordinput.value.trim();
        let valid = true;

        if (ugvalue === "") {
          ugerror.style.display = "block";
          uginput.style.borderColor = "red";
          valid = false;
        }
        if (pvalue === "") {
          perror.style.display = "block";
          passwordinput.style.borderColor = "red";
          valid = false;
        }
        return valid;
      }

      uginput.addEventListener("input", (e) => {
        ugerror.style.display = "none";
        uginput.style.borderColor = "";
      });

      passwordinput.addEventListener("input", (e) => {
        perror.style.display = "none";
        passwordinput.style.borderColor = "";
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!val()){
          return;
        }

        if (rme.checked) {
          localStorage.setItem("MATRIC NUMBER", uginput.value);
          localStorage.setItem("PASSWORD", passwordinput.value);
        } 
        form.reset();
        window.location.href = "test.html";
      });
    </script>
  </body>
</html>
