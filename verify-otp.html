<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verify Email</title>
  <link rel="stylesheet" href="logincss.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

      <div class="body">

        <!-- Header -->
        <div class="page-header">
          <div class="email-icon">
            <i class="fa-solid fa-envelope-circle-check"></i>
          </div>
          <p class="uppertext">Verify Your Email</p>
          <p class="undertext">
            We've sent a 6-digit verification
            code to
          </p>
          <strong id="emailDisplay">
            a***@gmail.com
          </strong>
        </div>


        <!-- OTP Form -->
        <form class="otpForm">
          <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
              autofocus>
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
          </div>

          <small class="error"></small>

          <!-- Timer -->
          <div class="timer-container">
            <span>
              Code expires in
            </span>
            <strong id="timer">
              05:00
            </strong>
          </div>

          <!-- Verify Button -->
          <button type="submit" class="button">
              <a href="normalforgotpassword.html">Verify Code</a>
            <span id="spinner" class="spinner"></span>
          </button>

        </form>


        <!-- Resend -->
        <div class="resend-container">
          <span>
            Didn't receive the code?
          </span>

          <button type="button">
            Resend Code
          </button>

          <span class="resend-timer">
            in 60s
          </span>

        </div>


        <!-- Help -->
        <div class="helpBox">

          <i class="fa-solid fa-circle-info"></i>

          <p>
            Check your inbox or spam folder
            if you don't see the verification
            code.
          </p>
        </div>

        <!-- Footer -->
        <div class="pageFooter">
          <p>
            Entered the wrong email?
            <a href="forgot-password.html" class="link">
              Change email
            </a>
          </p>
        </div>

      </div>


  <script src="script/verify-otp.js"></script>

</body>

</html>
