<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password</title>

  <link rel="stylesheet" href="logincss.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="body">
    <!-- Header -->
    <div class="page-header">
      <div class="email-icon">
        <i class="fa-solid fa-envelope"></i>
      </div>
      <p class="uppertext">Forgot Password</p>
      <p class="undertext">
        Enter the email address associated
        with your account and we'll send you
        a verification code.
      </p>

    </div>

    <!-- Message -->
    <div class="error">ggggggg</div>

    <!-- Form -->
    <form class="fBody">

      <div class="inm">
        <label for="uginput" class="text">Email Address</label>
        <div class="ip">
          <input type="text" class="up" id="uginput" placeholder="enter your registered email" />
          <small id="ugerror"></small>
        </div>
      </div>

      <a href="verify-otp.html" class="continueee">
        <button type="submit" class="button">
          Continue
          <span class="spinner"></span>
        </button>
      </a>

    </form>


    <!-- Help -->
    <div class="helpFooter">
      <div class="helpBox">
        <i class="fa-solid fa-circle-info"></i>
        <p>
          Make sure you enter the email
          address registered with your
          account.
        </p>
      </div>


      <!-- Footer -->
      <div class="pageFooter">
        <p>
          Remember your password?
          <a href="loginpage.html" class="link">
            Login
          </a>
        </p>
      </div>
    </div>

  </div>


  <script src="script/forgot-password.js"></script>

</body>

</html>
