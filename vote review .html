<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --pmain: #0b1f3a;
      --smain: #2563eb;
      --stroke: #e4e7ec;
      --white: #ffffff;
      --bg: #f6f8fc;
      --mtext: #172033;
      --stext: #667085;
      --gtext: #16a34a;
      --amain: #eaf1ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: inter;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
    }

    /* -------------------------- SIDE BAR ------------------------ */

    a {
      text-decoration: none;
      color: inherit;
    }

    .sidebar {
      width: 240px;
      height: 100vh;
      background: var(--pmain);
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0px 20px;
    }

    /* ------------------- SIDE BAR HEADER -------------------- */

    .sidebar-header {
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 20px;
      border-bottom: 1PX solid #4365ad;
    }

    .sideup {
      font-size: 22px;
      font-weight: bold;
      color: var(--white);
      letter-spacing: 4px;
    }

    .sidedown {
      font-size: 12px;
      color: #b9c9da;
    }

    /* -------------------- SIDE BAR LINKS --------------- */

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      color: var(--white);
      font-size: 14px;
      font-weight: 400;
      transition: 0.2s;
    }

    .nav-link:hover {
      background: var(--amain);
      color: var(--pmain);
    }

    .nav-link.active {
      background: var(--smain);
      color: var(--white);
      font-weight: 600;
    }

    /* ----------------------------------- BODY ----------------------------------- */

    .body {
      min-height: 100vh;
      margin-left: 240px;
      width: calc(100% - 240px);
    }

    /* ------------------------- TOP NAV ------------------------- */

    .topnav {
      height: 80px;
      background-color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0px 20px;
      border-bottom: 1px solid var(--stroke);
    }

    /* ---------- TOP NAV PAGE NAME ---------- */

    .pagename {
      font-size: 24px;
      font-weight: bold;
      color: var(--mtext);
    }

    /* ---------- TOP NAV ACCOUNT CSS ---------- */

    .account {
      position: relative;
    }

    .accountbtn {
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
    }

    /* ---------- TOP NAV ACCOUNT NAME AND LOGO ---------- */

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--pmain);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .nametag {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .name {
      font-size: 14px;
      font-weight: bold;
      color: var(--mtext);
    }

    .tag {
      font-size: 12px;
      color: var(--stext);
    }

    .accountbtn>i {
      font-size: 16px;
      color: var(--mtext);
    }

    /* ---------- TOP NAV DROPDOWN ---------- */

    .account-dropdown {
      display: none;
      flex-direction: column;
      position: absolute;
      right: 0;
      top: 57px;
      width: 190px;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.1);
      z-index: 2000;
    }

    .account-dropdown.show {
      display: flex;
    }



    .account-dropdown a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--mtext);
    }

    .linksss:hover {
      background: var(--stroke);
      color: var(--pmain);
    }

    .twolist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--stroke);
    }

    .dropdown-logout:hover {
      background: var(--smain);
      color: var(--white);
    }

    .menu-btn {
      display: none;
      padding: 10px;
    }


    @media (max-width: 800px) {
      .sidebar {
        display: none;
        /* transform: translateX(-100%); */

      }

      .sidebar.open {
        display: flex;
        /* transform: 
          translateX(0); */
      }

      .menu-btn {
        display: block;
      }
    }



    /* -------------------------- MAIN BODY CONTENT CSS ------------------------ */

    .bodycontent {
      background-color: var(--bg);
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }


    /* ---------- HEADER TEXT ---------- */

    .headtext {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .welcome {
      font-size: 28px;
      font-weight: bold;
      color: var(--mtext);
    }

    .category {
      font-size: 13px;
      font-weight: 400;
      color: var(--stext);
    }


    .last {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .election_cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      display: flex;
      padding: 20px;
      gap: 16px;
      flex-direction: column;
      background-color: var(--white);
      border: 1px solid var(--stroke);
      border-radius: 14px;
    }

    .card label {
      font-size: 18px;
      font-weight: 600;
      color: var(--mtext);
    }

    .candidatelist {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .candidate {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .candidate_name {
      font-size: 16px;
      font-weight: 600;
      color: var(--mtext);
    }


    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }


    .candidate input {
      width: 20px;
      height: 20px;
    }


    .buttons {
      display: flex;
      justify-content: space-between;
    }

    .last a .confirm {
      height: 48px;
      width: 122px;
      background-color: var(--smain);
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      border-style: none;
      border-radius: 8px;
    }

    .last a .back {
      height: 48px;
      width: 122px;
      background-color: var(--smain);
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      border-style: none;
      border-radius: 8px;
    }

    .last p {
      color: red;
      font-size: 13px;
      font-weight: 500;
    }
  </style>

</head>

<body class="dashboard-container">

  <!------------------------------- SIDEBAR -------------------------->

  <!------------ SIDE BAR HEADER ------------>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <p class="sideup">◈ UniVote</p>
      <p class="sidedown">Student portal</p>
    </div>

    <!------------ SIDE BAR LINKS ------------>

    <div class="sidebar-nav">
      <a href="test.html" class="nav-link">Dashboard</a>
      <a href="" class="nav-link active">Elections</a>
      <a href="voting activity.html" class="nav-link">Voting Activity</a>
      <a href="results.html" class="nav-link">Results</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <a href="reset password.html" class="nav-link">Settings</a>
    </div>
  </div>

  <!---------------------------- BODY WITH NAV BAR ---------------------------->

  <div class="body">

    <!---------------------- TOP NAV BAR ---------------------->

    <div class="topnav">

      <!------------ TOP NAV COLLAPSED BUTTON ------------>

      <button class="menu-btn" id="menuBtn">
        <i class="fa-solid fa-bars"></i>
      </button>

      <!------------ TOP NAV CURRENT PAGE NAME ------------>

      <div class="pagename">Review Vote</div>

      <!------------ TOP NAV PROFILE ACCOUNT ------------>

      <div class="account">
        <button class="accountbtn" id="profileButton">
          <div class="logo">AD</div>
          <div class="nametag">
            <span class="name">Adam Jidda</span>
            <span class="tag">Student</span>
          </div>
          <i class="fa-solid fa-chevron-down"></i>
        </button>

        <!------------ TOP NAV DROPDOWN FIELD ------------>

        <div class="account-dropdown" id="profileDropdown">
          <div class="twolist">
            <a href="profile.html" class="linksss"> <i class="fa-regular fa-user"></i> My Profile </a>
            <!-- <a href="#" class="linksss"><i class="fa-solid fa-gear"></i> Account Settings</a> -->
          </div>
          <a href="#" class="dropdown-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </a>
        </div>
      </div>
    </div>

    <!--------------------------- MAIN BODY DESIGN CONTENT --------------------------->

    <div class="bodycontent">

      <!-- ------------- HEADING TEXT ---------- -->

      <div class="headtext">
        <p class="welcome">Review your selection</p>
        <p class="category">
          <span>Make sure everything is correct before confirming.</span>
        </p>
      </div>

      <div class="last">
        <div class="election_cards">
          <div class="card">
            <label for="candidate">President</label>
            <div class="candidate">
              <img id="presidentVoteImage" alt="Selected President candidate">
              <span class="candidate_name" id="presidentVote">No candidate selected</span>
            </div>

          </div>

          <div class="card">
            <label for="candidate">Finance</label>
            <div class="candidate">
              <img id="financeVoteImage" alt="Selected Finance candidate">
              <span class="candidate_name" id="financeVote">No candidate selected</span>
            </div>
          </div>
        </div>
        <p>Your vote cannot be changed after confirmation.</p>

        <div class="buttons">
          <a href="election details.html"><button class="back">Back</button></a>
          <a href="vote success.html"><button class="confirm">Confirm Vote</button></a>
        </div>
      </div>


    </div>

    <!----------------------- SCRIPT ----------------------->

    <script>

      document.getElementById("presidentVote").textContent =
        localStorage.getItem("univoteVotePresident") || "No candidate selected";
      document.getElementById("financeVote").textContent =
        localStorage.getItem("univoteVoteFinance") || "No candidate selected";

      const candidateImages = [
        ["presidentVoteImage", "univoteVoteImagePresident"],
        ["financeVoteImage", "univoteVoteImageFinance"],
      ];

      candidateImages.forEach(([imageId, storageKey]) => {
        const imagePath = localStorage.getItem(storageKey);
        const image = document.getElementById(imageId);

        if (imagePath) {
          image.src = imagePath;
        } else {
          image.hidden = true;
        }
      });

      const menuButton = document.getElementById("menuBtn");
      const sidebar = document.getElementById("sidebar");
      const profileButton = document.getElementById("profileButton");
      const profileDropdown = document.getElementById("profileDropdown");


      profileButton.addEventListener("click", (event) => {
        event.stopPropagation();
        profileDropdown.classList.toggle("show");
      });


      document.addEventListener("click", (event) => {
        if (
          !profileButton.contains(event.target) &&
          !profileDropdown.contains(event.target)
        ) {
          profileDropdown.classList.remove("show");
        }
      });

      menuButton.addEventListener('click', (e) => {
        sidebar.classList.toggle('open');
      });



    </script>
</body>

</html>
